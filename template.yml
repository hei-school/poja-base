AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: poja-base - Computation and API

Globals:
  Function:
    CodeUri: .
    Runtime: java21
    Tracing: Active
    Architectures:
      - arm64
    EventInvokeConfig:
      MaximumRetryAttempts: 0
    AutoPublishAlias: live
    SnapStart:
      ApplyOn: PublishedVersions
    
    Environment:
      Variables:
        ENV: !Ref Env
        AWS_S3_BUCKET: !Sub '{{resolve:ssm:/poja-base/${Env}/s3/bucket-name}}'
        AWS_SES_SOURCE: lou@hei.school
        
        
        
        
        

Parameters:
  Env:
    Type: String

Resources:
  FrontalServerlessHttpApi:
    StageName: $default
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
        AllowOrigins:
          - "*"

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FrontalServerlessHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "${FrontalFunction.Arn}:live"
      PayloadFormatVersion: "1.0"
      IntegrationMethod: ANY
      TimeoutInMillis: 20000

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FrontalServerlessHttpApi
      RouteKey: $default
      Target: !Sub "integrations/${HttpApiIntegration}"

  FrontalFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.company.base.ApiEventHandler::handleRequest
      MemorySize: 256
      Timeout: 30
      Role: !Sub '{{resolve:ssm:/poja-base/${Env}/execution/role-arn}}'
      
      Events:
        ApiCall:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId:
              Ref: FrontalServerlessHttpApi

  ApiUrlSSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join [ '', [ /poja-base/, !Ref Env, /api/url ] ]
      Type: String
      Value: !GetAtt FrontalServerlessHttpApi.ApiEndpoint

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !GetAtt ApiUrlSSM.Value
